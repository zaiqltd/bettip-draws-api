name: Sync draws from the live API
on:
  schedule: [{ cron: '17 21 * * *' }]   # 23:17 SAST, after Teatime has landed
  workflow_dispatch:
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync.mjs
      - run: |
          git config user.name "bettip-sync"
          git config user.email "sync@bettip.co.za"
          git add data && git diff --cached --quiet || git commit -m "data: draws to $(date -u +%F)" && git push
